[package]
name = "aku-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Generic, configuration-driven supervisor for local development services"
license = "UNLICENSED"
publish = false
default-run = "aku-supervisor"

[features]
default = []
test-fixtures = []

[lib]
name = "aku_supervisor"
path = "src/lib.rs"

[[bin]]
name = "aku-supervisor"
path = "src/main.rs"

[[bin]]
name = "aku-supervisor-process-fixture"
path = "tests/fixtures/process_tree.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "aku-supervisor-signal-fixture"
path = "tests/fixtures/signal_owner.rs"
required-features = ["test-fixtures"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
